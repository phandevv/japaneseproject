services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - APP_DATABASE_TYPE=${APP_DATABASE_TYPE:-mongodb}
      - MONGO_DB_URL=${MONGO_DB_URL:-}
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI:-${MONGO_DB_URL:-mongodb+srv://myjsdb:qwertyuiopqaz@myjsdb.dhfyvpg.mongodb.net/japanesedb?retryWrites=true&w=majority&appName=MyJsDB}}
      - JWT_SECRET=${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://phandeptrai.id.vn}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
