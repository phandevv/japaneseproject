# ============================================================
# Production Profile — runs inside Docker container
# All sensitive values loaded from environment variables
# ============================================================

# Database — AWS RDS MySQL or MongoDB Atlas
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/japanesedb}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hikari Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=15000

# H2 Console — DISABLED in production (security risk)
spring.h2.console.enabled=false

# JWT Secret — MUST be set via environment variable in production
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_ENV_VAR}

# CORS — set to your actual domain(s)
cors.allowed-origins=${CORS_ORIGINS:http://localhost}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging — reduce verbosity in production
logging.level.root=WARN
logging.level.com.flashcard=WARN
logging.file.name=/data/logs/app.log
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=10MB

# Actuator — expose health endpoint only (for monitoring tools like UptimeRobot)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Hibernate Search — Lucene embedded (no separate server)
spring.jpa.properties.hibernate.search.backend.directory.root=/data/lucene-index
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update
