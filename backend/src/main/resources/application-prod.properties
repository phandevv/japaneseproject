# ============================================================
# Production Profile — runs inside Docker container
# All sensitive values loaded from environment variables
# ============================================================

# Database Mode - MongoDB Atlas by default
app.database.type=${APP_DATABASE_TYPE:mongodb}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_DB_URL:}}
spring.data.mongodb.database=${MONGO_DB_NAME:japanesedb}
spring.data.mongodb.auto-index-creation=true

# Cache Configuration - Redis Cloud
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.cache.cache-names=dashboard,leaderboard,vocab-stats,grammar-navigation,jlpt-overview,user-settings,vocabulary,vocabulary-level
spring.data.redis.url=${REDIS_URL:redis://default:AfpdiSTemq8TH4rnYgvJnCdaENWoablq@dear-leg-ear-33541.db.redis.io:17374}
spring.data.redis.timeout=5000ms

# Database — MySQL or H2 in-memory fallback
spring.datasource.url=${DB_URL:jdbc:h2:mem:flashcard;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hikari Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=15000

# H2 Console — DISABLED in production (security risk)
spring.h2.console.enabled=false

# JWT Secret — MUST be set via environment variable in production
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_ENV_VAR}

# CORS — set to your actual domain(s)
cors.allowed-origins=${CORS_ORIGINS:http://localhost}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging — reduce verbosity in production
logging.level.root=WARN
logging.level.com.flashcard=WARN
logging.file.name=/data/logs/app.log
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=10MB

# Actuator — expose health endpoint only (for monitoring tools like UptimeRobot)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Hibernate Search — Lucene embedded (no separate server)
spring.jpa.properties.hibernate.search.backend.directory.root=/data/lucene-index
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update
