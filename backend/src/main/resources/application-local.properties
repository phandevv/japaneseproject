spring.datasource.url=jdbc:h2:file:./data/flashcard;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS — local frontend dev servers
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Actuator — expose health endpoint only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Hibernate Search — Lucene embedded (no separate server)
spring.jpa.properties.hibernate.search.backend.directory.root=./data/lucene-index
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update
