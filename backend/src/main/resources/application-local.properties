# Database Mode - MongoDB Atlas (Synchronized with Production DB)
app.database.type=mongodb
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_DB_URL:mongodb+srv://myjsdb:qwertyuiopqaz@myjsdb.dhfyvpg.mongodb.net/?appName=MyJsDB}}
spring.data.mongodb.database=${MONGO_DB_NAME:japanesedb}
spring.data.mongodb.auto-index-creation=true
flyway.enabled=false
spring.flyway.enabled=false

# H2 in-memory fallback for local context
spring.datasource.url=jdbc:h2:mem:flashcard;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# CORS — local frontend dev servers
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Actuator — expose health endpoint only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Hibernate Search — Lucene embedded (no separate server)
spring.jpa.properties.hibernate.search.backend.directory.root=./data/lucene-index
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update
