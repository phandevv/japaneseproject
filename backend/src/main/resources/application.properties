spring.servlet.multipart.max-request-size=10MB
spring.jpa.open-in-view=false

# Cache configuration
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.cache.cache-names=dashboard,leaderboard,vocab-stats,grammar-navigation,jlpt-overview,user-settings,vocabulary,vocabulary-level
spring.cache.caffeine.spec=expireAfterWrite=10m,maximumSize=1000

# Redis Configuration (Support REDIS_URL from env)
