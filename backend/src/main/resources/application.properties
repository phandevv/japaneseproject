spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.open-in-view=false

# Cache configuration
spring.cache.type=caffeine
spring.cache.cache-names=vocabulary,vocabulary-level
spring.cache.caffeine.spec=expireAfterWrite=10m,maximumSize=10000

# Database Mode (mysql or mongodb)
app.database.type=${APP_DATABASE_TYPE:mysql}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_DB_URL:mongodb://localhost:27017/nihongocards}}
spring.data.mongodb.auto-index-creation=true
flyway.enabled=${FLYWAY_ENABLED:true}

# Sentry Configuration
sentry.dsn=${SENTRY_DSN:}
