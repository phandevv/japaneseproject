stages:
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: $AWS_REGION
  BACKEND_IMAGE: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/japaneseproject-backend:latest
  FRONTEND_IMAGE: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/japaneseproject-frontend:latest

build_images:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - |
      if [ -z "$AWS_REGION" ] || [ -z "$AWS_ACCOUNT_ID" ]; then
        echo "=========================================================================="
        echo "ERROR: AWS_REGION or AWS_ACCOUNT_ID not defined in GitLab CI/CD Variables!"
        echo "=========================================================================="
        exit 1
      fi
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
  script:
    - docker build -t $BACKEND_IMAGE ./backend
    - docker build -t $FRONTEND_IMAGE ./frontend
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ]; then
        docker push $BACKEND_IMAGE
        docker push $FRONTEND_IMAGE
      else
        echo "Skipping ECR push for Merge Request / branch: $CI_COMMIT_REF_NAME"
      fi
  only:
    - main
    - master
    - merge_requests

deploy_aws:
  stage: deploy
  # Use docker image with AWS CLI — run as shell, not as aws entrypoint
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - |
      if [ -z "$AWS_REGION" ] || [ -z "$AWS_ACCOUNT_ID" ]; then
        echo "ERROR: AWS_REGION or AWS_ACCOUNT_ID not set"
        exit 1
      fi
  script:
    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:aws:cloudformation:stack-name,Values=JapaneseProjectStack" "Name=instance-state-name,Values=running" \
        --query "Reservations[0].Instances[0].InstanceId" \
        --output text \
        --region $AWS_REGION)

      if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
        echo "Error: No running EC2 instance found for stack JapaneseProjectStack"
        exit 1
      fi

      echo "Found EC2 Instance ID: $INSTANCE_ID"

      # Build the redeploy command (injects DEEPSEEK_API_KEY from GitLab CI/CD dynamically)
      COMMAND="cd /home/ec2-user/app && aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com && docker-compose pull && DEEPSEEK_API_KEY=\"$DEEPSEEK_API_KEY\" docker-compose --env-file .env up -d --remove-orphans"

      aws ssm send-command \
        --document-name "AWS-RunShellScript" \
        --instance-ids "$INSTANCE_ID" \
        --parameters "commands=[\"$COMMAND\"]" \
        --comment "CI/CD Auto Redeploy - $CI_COMMIT_SHORT_SHA" \
        --region $AWS_REGION
  only:
    - main
    - master
